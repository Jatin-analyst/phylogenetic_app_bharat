services:
  - type: web
    name: phylo-django
    env: python
    buildCommand: pip install -r requirements.txt && mkdir -p django_sessions && python manage.py collectstatic --noinput
    startCommand: gunicorn phylo_django.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "phylo-django.onrender.com,.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.0"
